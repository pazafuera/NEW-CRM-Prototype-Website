            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,

              method: "POST",
              headers: {

              }),
            }
          );

            throw new Error(`HTTP error! status: ${response.status}`);

                  </div>
                  </HL>
                  <HL type="personalized">
                  <div className="bg-white border-2 border-purple-100 rounded-lg overflow-hidden shadow-sm relative">

                </div>
              </section>
              <HL type="ads" when={persona.bottomBanner.isSponsored}>

                <section className={`w-full h-36 md:h-40 rounded-xl overflow-hidden relative shadow-lg mt-8 ${persona.bottomBanner.color}`}>

                {persona.bottomBanner.isSponsored && <div className="flex justify-end pt-1 pr-1"><span className="text-[10px] text-gray-500 uppercase">Sponsored</span></div>}

              <HL type="merch"><CategorySpotlight persona={persona} /></HL>

                   <div className="flex gap-4 overflow-x-auto pb-4 scrollbar-hide">{persona.finalRecommendations.products.map((product) => (<ProductCard key={product.id} product={product} compact={true} />))}</div>
                </div>
              </section>
              </HL>
              <HL type="ads"><SponsoredBrandUnit persona={persona} /></HL>
            </main>
            <footer className="bg-gray-100 border-t border-gray-200 mt-12 py-12 text-gray-600 text-sm">
              <div className="max-w-7xl mx-auto px-4 grid grid-cols-2 md:grid-cols-4 gap-8">
                <div><h4 className="font-bold text-gray-800 mb-4">Customer Service</h4><ul className="space-y-2"><li><a href="#" className="hover:underline">Get Help</a></li><li><a href="#" className="hover:underline">Track Order</a></li><li><a href="#" className="hover:underline">Returns</a></li></ul></div>

              </div>
              <div className="max-w-7xl mx-auto px-4 mt-12 pt-8 border-t border-gray-200 text-center"><p>© 2024 Costco Wholesale Corporation. All rights reserved.</p></div>

            <CostcoAssistant persona={persona} />

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
